name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[advanced]'
      - run: python -c 'from electrochem_toolkit import inverse, electrothermal; import matplotlib'
      - run: python -m unittest discover -s tests -v
      - run: electrochem-toolkit stack --cells 10 --area 100 --density 0.3 --voltage 1.8
      - run: electrochem-toolkit impedance --frequency 10 --rs 0.2 --rct 1.5 --capacitance 0.01
      - run: electrochem-toolkit battery --time 0 3600 7200 --current 2 2 -2
      - run: electrochem-toolkit report examples/experimental-pipeline/sample.csv summary.json
      - run: python examples/electrochemical-analysis/impedance.py
      - run: python examples/electrolyser-calculator/stack.py --cells 10 --area 100 --current-density 0.3 --voltage 1.8
      - run: python examples/experimental-pipeline/pipeline.py examples/experimental-pipeline/sample.csv summary.json
      - name: Website figures match the studies
        run: |
          cmp studies/eis-inverse/results.svg docs/assets/eis-results.svg
          cmp studies/electrothermal-stack/results.svg docs/assets/electrothermal-results.svg
          cmp studies/flow-battery/results.svg docs/assets/flow-battery-results.svg
          cmp studies/corrosion/results.svg docs/assets/corrosion-results.svg
          cmp studies/tafel-analysis/results.svg docs/assets/tafel-results.svg
      - run: python studies/eis-inverse/run.py
      - run: python studies/electrothermal-stack/run.py
      - run: python studies/flow-battery/run.py
      - run: python studies/corrosion/run.py
      - run: python studies/tafel-analysis/run.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: computational-study-results
          path: study-output/
          if-no-files-found: error
