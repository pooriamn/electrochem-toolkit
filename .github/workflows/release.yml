name: Release
on:
  push:
    branches: [main]
    paths: [pyproject.toml, CHANGELOG.md, ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[advanced]' build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-distributions
          path: dist/
  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-distributions
          path: dist
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag="v$version"
          # Release notes are the changelog section for this version only.
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Electrochemical Engineering Toolkit $tag" --notes-file notes.md
  pypi:
    # Enable once a PyPI trusted publisher is configured for this repository
    # (repository variable PUBLISH_TO_PYPI = true).
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolkit-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
