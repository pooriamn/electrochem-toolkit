[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "electrochemical-engineering-toolkit"
version = "0.4.0"
description = "Electrochemical engineering calculations you can check: impedance fitting, electrolyser and flow battery models, corrosion and Tafel analysis, and validated measurement reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pooria Moozarm Nia"}]
keywords = [
  "electrochemistry", "electrochemical-impedance-spectroscopy", "eis",
  "water-electrolysis", "hydrogen", "electrolyser", "battery",
  "equivalent-circuit", "redox-flow-battery", "corrosion", "tafel",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
advanced = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://pooriamn.github.io/electrochem-toolkit/"
Repository = "https://github.com/pooriamn/electrochem-toolkit"
Changelog = "https://github.com/pooriamn/electrochem-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/pooriamn/electrochem-toolkit/issues"

[project.scripts]
electrochem-toolkit = "electrochem_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
